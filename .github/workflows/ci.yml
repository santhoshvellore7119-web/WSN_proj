name: WSN Energy-Aware Routing Full-Stack CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  python-test:
    name: Core Simulator & Backend Pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install fastapi uvicorn httpx scipy

      - name: Execute Full Pytest Suite (Core & Backend API)
        run: |
          pytest -v --tb=short

      - name: Run Demonstration Simulation
        run: |
          python main.py --nodes 30 --rounds 20 --visualize

  frontend-build:
    name: Frontend Test & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Unit Tests
        working-directory: ./frontend
        run: npm test -- --watchAll=false

      - name: Build React Production Bundle
        working-directory: ./frontend
        env:
          CI: true
        run: npm run build
